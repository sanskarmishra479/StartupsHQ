# Weekly audit of the whole lockfile (SEC-13).
# GitHub's dependency graph reads only direct dependencies from this pnpm 12 project,
# so Dependabot alerts cannot see transitive packages. This job covers everything,
# including weeks with no commits.
name: Dependency audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm

      - name: Full audit report (all severities)
        run: pnpm audit
        continue-on-error: true

      - name: Fail on high severity
        run: pnpm audit --audit-level high
