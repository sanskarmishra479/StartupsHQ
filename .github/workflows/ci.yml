# Quality gates for every push to main and every pull request (docs/TEST_PLAN.md §1, §14).
# Actions are GitHub-owned and pinned to full commit SHAs (SEC-20).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # PostgreSQL 17.11 — same digest as docker-compose.yml.
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: startupshq
          POSTGRES_PASSWORD: startupshq_ci
          POSTGRES_DB: startupshq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U startupshq -d startupshq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI-only credential for an ephemeral service container; not a secret.
      TEST_DATABASE_URL: postgres://startupshq:startupshq_ci@127.0.0.1:5432/startupshq_test

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm (version from package.json)
        run: corepack enable pnpm

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install (frozen lockfile, supply-chain policies)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Client bundle secret scan (SEC-01)
        run: pnpm check:leak

      - name: Dependency audit (fails on high severity)
        run: pnpm audit --audit-level high
